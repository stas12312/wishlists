name: Deploy on test

on:
  push:
    branches: [ main ]

env:
  REGISTRY: mywishlists.registry.twcstorage.ru

jobs:
  build-images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - tag: backend
            context: src/backend
          - tag: ui
            context: src/frontend
    steps:
      - name: Set current date
        id: date
        run: |
          echo "build_date=$(date +"%d.%m.%Y %H:%M")" >> $GITHUB_OUTPUT
      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: "{{defaultContext}}:${{ matrix.context }}"
          push: true
          tags: ${{ env.REGISTRY }}/${{ matrix.tag }}:tested
          build-args: &build-args |
            build_time=${{ steps.date.outputs.build_date }}
            version=${{ github.run_number }}-dev
            base_url=${{ secrets.TEST_BASE_URL }}
            yandex_metrika_id=${{ secrets.TEST_YANDEX_METRIKA_ID }}
            static_url=${{ secrets.TEST_STATIC_URL }}
            sentry_dsn=${{ secrets.TEST_SENTRY_DSN }}
            ws_url=${{ secrets.TEST_WS_URL }}
            donate_url=${{ secrets.DONATE_URL }}
            sentry_conf=${{ secrets.TEST_SENTRY_CONF }}
      # Слои берутся из кэша предыдущего шага, повторной сборки нет
      - name: Export sourcemaps
        if: matrix.tag == 'ui'
        uses: docker/build-push-action@v6
        with:
          context: "{{defaultContext}}:${{ matrix.context }}"
          target: sourcemaps
          outputs: type=local,dest=sourcemaps
          build-args: *build-args
      - name: Save sourcemaps
        if: matrix.tag == 'ui'
        uses: actions/upload-artifact@v4
        with:
          name: sourcemaps
          path: sourcemaps
          retention-days: 1

  # Не блокирует деплой: выполняется параллельно с ним
  upload-sourcemaps:
    runs-on: ubuntu-latest
    needs: [ build-images ]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: sourcemaps
          path: sourcemaps
      - name: Upload sourcemaps to Sentry
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.TEST_SENTRY_AUTH_TOKEN }}
          SENTRY_CONF: ${{ secrets.TEST_SENTRY_CONF }}
          SENTRY_RELEASE: ${{ github.run_number }}-dev
        run: |
          IFS=';' read -r SENTRY_URL SENTRY_ORG SENTRY_PROJECT <<< "$SENTRY_CONF"
          export SENTRY_URL SENTRY_ORG SENTRY_PROJECT
          npx --yes @sentry/cli@2.58.5 releases new "$SENTRY_RELEASE"
          npx --yes @sentry/cli@2.58.5 sourcemaps upload --release "$SENTRY_RELEASE" sourcemaps
          npx --yes @sentry/cli@2.58.5 releases finalize "$SENTRY_RELEASE"

  deploy:
    runs-on: ubuntu-latest
    needs: [ build-images ]
    steps:
      - name: executing remote ssh commands using password
        uses: appleboy/ssh-action@master
        env:
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
        with:
          host: ${{ secrets.TEST_SERVER_HOST }}
          username: ${{ secrets.TEST_SERVER_USER }}
          key: ${{ secrets.TEST_SERVER_PRIVATE_KEY }}
          envs: REGISTRY_USERNAME,REGISTRY_PASSWORD
          script: |
            echo "$REGISTRY_PASSWORD" | docker login ${{ env.REGISTRY }} --username "$REGISTRY_USERNAME" --password-stdin
            cd ${{ secrets.TEST_PROJECT_PATH }}
            git pull
            docker compose -f docker-compose.yml -f docker-compose.test.yml pull backend frontend \
            && docker compose -f docker-compose.yml -f docker-compose.test.yml up -d --no-build
