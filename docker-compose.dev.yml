services:
  db:
    image: postgres:16.1-alpine
    restart: always
    environment:
      POSTGRES_PASSWORD: ${PG_PASSWORD}
      POSTGRES_USER: ${PG_USER}
    volumes:
      - ./postgres:/var/lib/postgresql/data
    ports:
      - "6432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER}"]
      interval: 2s
      timeout: 3s
      retries: 15
  redis:
    image: redis:7-alpine
    restart: always
    volumes:
      - ./redis-data:/data
    ports:
      - ${REDIS_PORT}:6379
  backend:
    build:
      context: src/backend
    container_name: backend
    networks:
      - default
      - my_wishlists
    env_file:
      - .env
    ports:
      - ${API_PORT}:8080
      - "2345:2345"
    volumes:
      - ./src/backend/:/app/
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
  proxy:
    image: nginx:1.27-alpine
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/dev.conf:/etc/nginx/conf.d/default.conf:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - backend
  frontend:
    build:
      context: src/frontend
    container_name: frontend
    ports:
      - ${UI_PORT}:3000
    env_file:
      - .env

networks:
  my_wishlists:
    external: true
    name: my_wishlists_dev_network
