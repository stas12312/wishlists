<h1 class="mail-title" style="margin:0 0 12px; font-size:32px; line-height:38px; letter-spacing:-0.5px; word-wrap:break-word; overflow-wrap:anywhere;">{title}</h1>
<p style="margin:0 0 16px; color:#605a66; font-size:14px; line-height:21px; word-wrap:break-word; overflow-wrap:anywhere;">{author}</p>
<table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="table-layout:fixed; margin-bottom:24px;">
  <tr>
    <td bgcolor="#f6f4ee" style="padding:16px 18px; border-radius:10px; color:#39343f; font-size:16px; line-height:24px; word-wrap:break-word; overflow-wrap:anywhere;">{content}</td>
  </tr>
</table>
<table role="presentation" cellspacing="0" cellpadding="0" border="0">
  <tr>
    <td bgcolor="#ffd76b" style="border-radius:9px; mso-padding-alt:12px 20px;">
      <a href="{link}" style="display:inline-block; padding:12px 20px; mso-padding-alt:0; color:#292431; font-size:16px; line-height:24px; font-weight:700; text-decoration:none;">Открыть обращение</a>
    </td>
  </tr>
</table>
