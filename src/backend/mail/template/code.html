<h1 class="mail-title" style="margin:0 0 12px; font-size:32px; line-height:38px; letter-spacing:-0.5px;">{code_title}</h1>
<p style="margin:0 0 20px; color:#514b58;">Введите код в MyWishlists или воспользуйтесь кнопкой ниже.</p>
<table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="margin-bottom:24px;">
  <tr>
    <td align="center" bgcolor="#fff6dc" style="padding:16px 12px; border:1px solid #f0e2bc; border-radius:12px; color:#292431; font-family:Consolas,'Courier New',monospace; font-size:32px; font-weight:700; line-height:40px; letter-spacing:5px;">{code}</td>
  </tr>
</table>
<table role="presentation" cellspacing="0" cellpadding="0" border="0">
  <tr>
    <td bgcolor="#ffd76b" style="border-radius:9px; mso-padding-alt:12px 20px;">
      <a href="{link}" style="display:inline-block; padding:12px 20px; mso-padding-alt:0; color:#292431; font-size:16px; line-height:24px; font-weight:700; text-decoration:none;">{action}</a>
    </td>
  </tr>
</table>
<p style="margin:24px 0 0; padding-top:16px; border-top:1px solid #eae5dc; color:#605a66; font-size:14px; line-height:21px;">Если вы не запрашивали код, проигнорируйте это письмо.</p>
